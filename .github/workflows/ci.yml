name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: End-to-end smoke run (synthetic data, no network)
        env:
          DCSEC_DATA_SOURCE: synthetic
        run: python -m src.pipeline

      - name: Upload smoke-run outputs
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-outputs
          path: outputs/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t datacenter-security-capstone .

      - name: Run the pipeline in the container (synthetic data)
        run: docker run --rm -e DCSEC_DATA_SOURCE=synthetic datacenter-security-capstone
